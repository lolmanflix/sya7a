# ============================================================================
# Jarvis — Bandwidth-Frugal yt-DLP Profile ("data-saver")
# ============================================================================
# Single source of truth for every download default. Do NOT hardcode these
# flags in scripts or skill examples; override per-call on the CLI instead.
#
# Apply with (order matters — --ignore-config first):
#   yt-dlp --ignore-config --config-locations <THIS_FILE> [EXTRA FLAGS] URL
#
# Bandwidth levers actually reduce bytes downloaded:
#   1. Format capping (resolution/codec selection)   <- biggest lever
#   2. Audio-only extraction                          <- 5-10x cheaper than video
#   3. Partial capture via --download-sections        <- linear savings
#   4. Skipping thumbnails / comments / subs          <- small but free
#   5. Resuming interrupted transfers                 <- avoids re-downloading
# NOTE: --limit-rate / throttling only shapes traffic, it never reduces it.
# ============================================================================

# --- Output -----------------------------------------------------------------
# Deterministic, collision-safe, length-trimmed filenames into ./downloads
# (relative to the working directory — always run from the project root).
-o "downloads/%(title).120B [%(id)s].%(ext)s"
--trim-filenames 180

# --- Selection: never swallow a whole playlist silently --------------------
--no-playlist

# --- Format ceiling: ~360p-equivalent video + best available audio ---------
# Caps use BOTH axes because portrait reels are 360x638 (width x height) — a
# height-only filter would reject them and silently fall through to 720p.
# Ladder: 360p-band -> 480p-band -> best progressive -> best video+audio.
-f bv*[width<=640][height<=640]+ba/b[width<=640][height<=640]/bv*[height<=480]+ba/b[height<=480]/b/bv*/b
# Prefer widely-decodable MP4/M4A when quality ties (smaller post-processing).
-S ext:mp4:m4a,res

# --- Network hygiene --------------------------------------------------------
--continue
--retries 5
--fragment-retries 5
--socket-timeout 20
# YouTube extraction requires a JS runtime; deno is the default but absent on
# this host, so bind the system Node.js (v22) instead of silently losing formats.
--js-runtimes node

# --- Bandwidth budget guard -------------------------------------------------
# Abort rather than silently pull a multi-GB file (e.g. 4K/8K playlist).
--max-filesize 300M

# --- Skip gratuitous extras -------------------------------------------------
--no-write-thumbnail
--no-write-comments
--no-write-subs

# --- Robust error handling (never hard-crash mid-extraction) ----------------
--no-abort-on-error
--ignore-no-formats-error
