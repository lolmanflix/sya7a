<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Tracker Map (archived demo)</title>
    <!--
      ARCHIVED BY EDIT - 2026-10-09 OpenFreeMap migration.

      This file is NOT referenced by any React Native module (verified by grep:
      no imports/loads of "OpenStreetMap.html" anywhere in mobile/src).
      It previously rendered OSM raster tiles through L.tileLayer, which is
      forbidden by the OpenFreeMap migration directive.

      It is kept as a minimal OpenFreeMap vector loader for manual debugging.
      The canonical map implementation is:
        mobile/src/components/map/passengerMapHtml.ts
        mobile/src/config/mapConfig.ts   <-- single source of truth for every
                                             map URL (tiles, styles, CDN assets).
      The CDN/style URLs below are duplicated here only because a static .html
      file cannot import TypeScript config; keep them in sync with mapConfig.ts.
    -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f8fafc; }
        #map { width: 100%; height: 100vh; }
        #map-fallback { display: none; position: fixed; left: 12px; right: 12px; bottom: 42px;
            padding: 10px 14px; border-radius: 8px; background: rgba(15, 23, 42, 0.92);
            color: #f8fafc; font-size: 13px; text-align: center; z-index: 1000; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="map-fallback" role="status">Map preview unavailable - check your network connection.</div>

    <script>
        // OpenFreeMap styles (see mobile/src/config/mapConfig.ts):
        // light = official default style, dark = dark mode option.
        var STYLE_URLS = {
            light: 'https://tiles.openfreemap.org/styles/liberty',
            dark: 'https://tiles.openfreemap.org/styles/dark'
        };
        var currentMode = 'light';

        function setFallback(visible) {
            var el = document.getElementById('map-fallback');
            if (el) el.style.display = visible ? 'block' : 'none';
        }

        if (typeof maplibregl === 'undefined') {
            setFallback(true);
        } else {
            // Attribution ("(c) OpenMapTiles (c) OpenStreetMap contributors") is
            // added automatically by MapLibre from the OpenFreeMap style sources.
            var map = new maplibregl.Map({
                container: 'map',
                style: STYLE_URLS[currentMode],
                center: [31.2357, 30.0444],
                zoom: 13
            });

            map.on('style.load', function () { setFallback(false); });
            map.on('error', function (ev) {
                console.warn('[OpenStreetMap.html] MapLibre error:', ev && ev.error);
                if (!ev || !ev.sourceId) setFallback(true);
            });

            window.__setMapStyle = function (mode) {
                currentMode = mode === 'dark' ? 'dark' : 'light';
                document.body.style.backgroundColor = currentMode === 'dark' ? '#090d16' : '#f8fafc';
                try { map.setStyle(STYLE_URLS[currentMode]); } catch (err) { setFallback(true); }
            };
        }
    </script>
</body>
</html>
